baseURL = 'https://bubbletea.cool/'
languageCode = 'zh-tw'
title = 'PHANGBIT'

# Disable just the taxonomy *index* pages (/categories/ and /tags/) —
# the chip row on /stories/ already acts as the index, so we don't need
# them. Individual `term` pages (/categories/編輯室/, /tags/創刊/) stay
# enabled so chip clicks land somewhere.
disableKinds = ['taxonomy']

# Hugo's built-in `categories` and `tags` taxonomies drive the chip
# rows on /stories/ (類型 + 議題).
[taxonomies]
  category = "categories"
  tag      = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "給資料記者提案調查、互動與視覺化報導的編輯室入口。"
  author = "PHANGBIT Editorial"
  pitchEmail = "pitch@phangbit.cool"
  # Formspree endpoint — sign up at formspree.io, create a form, paste the ID here.
  # e.g. "https://formspree.io/f/xyzabcde"
  formEndpoint = ""

[menus]
  [[menus.main]]
    name = "提案方式"
    url = "#how"
    weight = 10
  [[menus.main]]
    name = "我們想收"
    url = "#brief"
    weight = 20
  [[menus.main]]
    name = "送出提案"
    url = "#pitch-form"
    weight = 30
