<header class="site-header">
  <a class="skip-link" href="#main">跳到主要內容</a>
  <div class="nav-container">
    <a href="{{ "" | relURL }}" class="brand" aria-label="PHANGBIT 首頁">
      {{/* BrandMark: flat 2×2 honeycomb, ink background box */}}
      <span class="brand-mark-box" aria-hidden="true">
        <svg class="brand-mark-svg" viewBox="-4 -4 77.28 64" aria-hidden="true" focusable="false">
          <polygon points="13.86,0 27.71,8 27.71,24 13.86,32 0,24 0,8" fill="#00C2FF" stroke="#FFF7E4" stroke-width="2.4" stroke-linejoin="round"/>
          <polygon points="41.57,0 55.43,8 55.43,24 41.57,32 27.71,24 27.71,8" fill="#FFD400" stroke="#FFF7E4" stroke-width="2.4" stroke-linejoin="round"/>
          <polygon points="27.71,24 41.57,32 41.57,48 27.71,56 13.86,48 13.86,32" fill="#FF2E88" stroke="#FFF7E4" stroke-width="2.4" stroke-linejoin="round"/>
          <polygon points="55.43,24 69.28,32 69.28,48 55.43,56 41.57,48 41.57,32" fill="#6FE83A" stroke="#FFF7E4" stroke-width="2.4" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-word">phangbit<span class="brand-dot">.</span>cool</span>
    </a>

    {{/* Active state is decided by URL prefix match against the current page. */}}
    {{ $current := .RelPermalink }}
    <nav class="nav-links" aria-label="主選單">
      <a href="{{ "" | relURL }}"{{ if eq $current "/" }} class="active"{{ end }}>最新</a>
      <a href="{{ "stories/" | relURL }}"{{ if hasPrefix $current "/stories" }} class="active"{{ end }}>報導</a>
      <a href="{{ "about/" | relURL }}"{{ if hasPrefix $current "/about" }} class="active"{{ end }}>關於我們</a>
      <a href="{{ "about/#team" | relURL }}">編輯室</a>
    </nav>

    <a class="nav-action" href="{{ "article/#pitch-form" | relURL }}">送出提案 →</a>
  </div>
</header>
