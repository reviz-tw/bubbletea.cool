<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "zh-tw" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}{{ if .IsHome }}{{ site.Title }} | 資料報導提案入口{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ site.Title }} | 資料報導提案入口{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ "images/pitch-desk.png" | absURL }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ "images/favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  {{ block "head" . }}{{ end }}
</head>
<body>
  <div class="progress-bar" id="progressBar" aria-hidden="true"></div>
  {{ partial "header.html" . }}

  <div class="status-strip">
    <div class="status-strip-inner">
      <span class="status-live"><i class="status-pulse"></i> OPEN PITCH DESK · 提案中</span>
      <span class="status-sep">/</span>
      <span class="status-meta">本期截稿　<strong>2026.05.31</strong></span>
      <span class="status-sep">/</span>
      <span class="status-meta">已收提案　<strong>47 件</strong></span>
      <a class="status-link" href="#stories">看看上期的成果 →</a>
    </div>
  </div>

  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ block "scripts" . }}{{ end }}
</body>
</html>
